# Default hyperparameters for regeneration-robust watermark training/eval.
# Every key is overridable from the CLI (see scripts/train.py, scripts/infer.py).

seed: 42
device: cuda  # cuda | cpu | cuda:0
run_name: default

# --- data ---
data_root: ./data
dataset: coco  # coco | div2k | imagenette | clic | synthetic
image_size: 64
batch_size: 8
num_workers: 2
num_samples: null  # optional cap for quick tests
val_fraction: 0.1

# --- model ---
# 16 bits is a reliable warm-start capacity; raise after clean bit-acc is high.
msg_len: 16
encoder_ch: 64
decoder_ch: 64
encoder_strength: 0.4

# --- optimization ---
lr: 2.0e-3
epochs: 100
# Keep perceptual weight low so decode loss can form a watermark channel first.
lambda_perc: 0.05
val_every: 5
resume: null  # path to checkpoint

# --- attack sampler probabilities (baseline before curriculum) ---
# p(dist), p(regen), p(adv); residual probability is clean (identity).
attack_probs: [0.3, 0.3, 0.2]

# --- curriculum ---
# Warm-start: clean-only embed→decode (λ_perc≈0), then ramp attacks.
curriculum:
  enabled: true
  warm_start_epochs: 50
  warm_lambda_perc: 0.0
  p_regen_start: 0.05
  p_regen_step: 0.008
  p_regen_max: 0.3
  p_dist_floor: 0.15
  p_adv: 0.1
  p_clean_floor: 0.25

# --- DistortionBank / DiffJPEG ---
# Set use_real_diffjpeg=true for block-DCT + STE JPEG (see src/attacks/diffjpeg_real.py).
diffjpeg:
  quality: 50
  use_real_diffjpeg: false
  chroma_subsample: true

distortion:
  gaussian_std: 0.03

# --- PGD adversarial attack on decoder ---
pgd:
  eps: 0.02
  alpha: 0.005
  steps: 5

# --- RegenerationProxy (diffusion surrogate) ---
# Set use_placeholder=false to load real SD VAE/UNet/DDIM from sd_model_id.
# CLIP text embeds load automatically when the real proxy is used (or when
# use_real_text_embeds=true). image_size should be a multiple of 8 for the VAE.
regen:
  use_placeholder: true
  sd_model_id: runwayml/stable-diffusion-v1-5
  n_steps: 4
  t_start: 0.3
  torch_dtype: null  # null → fp16 on CUDA, fp32 on CPU
  local_files_only: false
  use_real_text_embeds: false
  prompt: ""  # empty = unconditional null-text (DiffPure / regen style)
  text_embed_seq_len: 77
  text_embed_dim: 768
  guidance_scale: 2.0

# --- evaluation ---
eval:
  attacks: [clean, jpeg, regen, guided_regen, unseen_blur]
  # UNSEEN attack held out from training DistortionBank
  unseen_blur_kernel: 5
  unseen_blur_sigma: 1.5

# --- logging / viz ---
log:
  save_best_metric: bit_acc_clean  # higher is better
