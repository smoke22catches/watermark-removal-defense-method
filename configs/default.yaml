# Default hyperparameters for regeneration-robust watermark training/eval.
# Every key is overridable from the CLI (see scripts/train.py, scripts/infer.py).

seed: 42
device: cuda  # cuda | cpu | cuda:0
run_name: default

# --- data ---
data_root: ./data
dataset: coco  # coco | div2k | imagenette | clic | synthetic
image_size: 64
batch_size: 8
# DataLoader: JPEG decode + Resize is CPU-bound; too few workers starve the GPU.
# On an RTX 4090 server use 8–16; set 0 only for tiny CPU dry-runs / debugging.
num_workers: 8
pin_memory: true          # faster H2D when training on CUDA
persistent_workers: true  # keep workers warm across epochs (requires num_workers > 0)
prefetch_factor: 4         # batches prepared ahead per worker
num_samples: null  # optional cap for quick tests (train only)
val_fraction: 0.1  # ignored when data/splits exist (kept for CLI compat)
# Fixed splits (seed-independent). Generate with scripts/make_splits.py.
splits_dir: data/splits
split_seed: 20241010  # NEVER reuse the training seed

# --- model ---
# 16 bits is a reliable warm-start capacity; raise after clean bit-acc is high.
msg_len: 16
encoder_ch: 64
decoder_ch: 64
encoder_strength: 0.4

# --- optimization ---
lr: 2.0e-3
epochs: 100
# Keep perceptual weight low so decode loss can form a watermark channel first.
lambda_perc: 0.05
val_every: 5
resume: null  # path | run-dir | auto
ckpt_every_iters: 500
# Mixed precision: Tensor Cores on Ada (4090). Kept off for CPU dry-runs automatically.
amp: true
# Cap PyTorch intra-op CPU threads so they do not fight DataLoader workers (htop >100%).
# null → auto (min(4, default)) on CUDA; set explicitly e.g. 2–4 on busy servers.
torch_num_threads: null
# Write per-step train loss rows every N iters (CSV open/flush every step was a CPU bottleneck).
log_every_iters: 50
# Optional CosineAnnealingLR over total epochs; null = constant LR (still checkpointed).
lr_scheduler: null  # null | cosine

# --- curriculum (attack branch probabilities) ---
# p_regen(e) = min(p0 + kappa * e, p_max)
# p_dist(e)  = 1 - p_regen(e) - p_adv
# p_adv      = constant
# Constraint: p_max + p_adv <= 1. Override via CLI, e.g. --curriculum-p0 0.1
curriculum:
  p0: 0.1
  kappa: 0.01
  p_max: 0.5
  p_adv: 0.2

# --- DistortionBank / DiffJPEG ---
# Set use_real_diffjpeg=true for block-DCT + STE JPEG (see src/attacks/diffjpeg_real.py).
diffjpeg:
  quality: 50
  use_real_diffjpeg: false
  chroma_subsample: true

distortion:
  gaussian_std: 0.03
  # Geometric share of distortion-branch draws (rest = jpeg/noise/downsample).
  geometric_share: 0.5
  padding_mode: border  # zeros | border | reflection
  max_angle: 15.0       # degrees, sampled in [-max_angle, max_angle]
  crop_area: [0.7, 1.0] # area fraction before resize-back
  scale: [0.8, 1.2]     # zoom in / out
  translate: 0.05       # max shift as fraction of side
  # Relative weights within classical / geometric groups (renormalized).
  weights:
    jpeg: 1.0
    noise: 1.0
    downsample: 1.0
    rotate: 1.0
    crop: 1.0
    rescale: 1.0
    translate: 1.0

# --- PGD adversarial attack on decoder ---
pgd:
  eps: 0.02
  alpha: 0.005
  steps: 5

# Regeneration training branch: ddim_proxy | blur_surrogate | none
regen_branch: ddim_proxy

# --- RegenerationProxy (diffusion surrogate) ---
# Set use_placeholder=false to load real SD VAE/UNet/DDIM + empty-prompt embeds
# from the same Hugging Face checkpoint (sd_model_id + sd_revision).
# The text encoder is used once at startup then freed; embeds may be disk-cached.
# image_size should be a multiple of 8 for the VAE.
regen:
  use_placeholder: true
  sd_model_id: runwayml/stable-diffusion-v1-5
  sd_revision: null  # HF revision; null → default branch
  null_text_cache_dir: .cache/null_text_embeds
  n_steps: 4
  t_start: 0.3
  torch_dtype: null  # null → fp16 on CUDA, fp32 on CPU
  local_files_only: false
  text_embed_seq_len: 77  # placeholder zeros only
  text_embed_dim: 768     # placeholder zeros only
  guidance_scale: 2.0
  # Guided PGD on regeneration output (second half of training).
  # guided_start_epoch: null → epochs // 2
  guided_start_epoch: null
  guided_prob: 0.5
  eps_guided: 0.02
  beta_guided: 0.005
  J_guided: 5

# --- baseline schemes (post-hoc comparative evaluation) ---
baselines:
  trustmark_variant: Q
  trustmark_use_ecc: false   # raw 100-bit messages (shared sampler)
  stegastamp_weights_dir: weights/stegastamp
  vine_encoder_id: Shilin-LU/VINE-R-Enc
  vine_decoder_id: Shilin-LU/VINE-R-Dec

# --- evaluation (real transforms; never training DistortionBank approximations) ---
eval:
  attacks: [clean, jpeg, rotate, crop, noise, unseen_blur, regen_proxy, guided_regen, diffpure, rinse_2, rinse_4, bmshj2018, cheng2020, adv]
  # DiffPure / rinse use a DIFFERENT diffusion checkpoint than regen.sd_model_id.
  diffpure_model_id: CompVis/stable-diffusion-v1-4
  diffpure_steps: 50
  diffpure_t_start: 0.5
  # true → offline blur+noise stand-in instead of loading eval SD weights (tests / dry-runs).
  diffpure_use_placeholder: false
  # Seen regen_proxy strengths: t* covering the training range around regen.t_start.
  regen_proxy_t_starts: [0.2, 0.3, 0.4]
  # Seen guided_regen strengths: eps_guided values around regen.eps_guided.
  guided_eps_values: [0.01, 0.02, 0.04]
  unseen_blur_kernel: 5
  unseen_blur_sigma: 1.5

# --- logging / viz ---
log:
  save_best_metric: bit_acc_clean  # higher is better
